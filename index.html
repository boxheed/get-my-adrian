<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reveal.js</title>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">

        <section data-auto-animate data-background-size="contain" data-background-image="/get-my-adrian/adrian_bulb_overlay.png">
           <h1 class="r-fit-text">Keeping the lights on</h1>
           <h3 >An Agent in the home</h3>
        </section>

        <section data-auto-animate >
          <h1 class="r-fit-text">Your Home is a Machine</h1>
          <table>
            <td width="50%"><div style="text-align: center;">More Then Just Bricks<img src=/get-my-adrian/home_more_than_bricks.png/></div></td>
            <td width="50%"><div style="text-align: center;">Powered By Code<img src=/get-my-adrian/home_powered_by_code.png/></div></td>
          </table>
        </section>

        <section data-auto-animate>
          <h1 class="r-fit-text">Maintenance</h1>
          <table>
            <td width="50%"><div style="text-align: center;">Increasing burden<img src=/get-my-adrian/home_more_than_bricks.png/></div></td>
            <td width="50%"><div style="text-align: center;">Increased failures<img src=/get-my-adrian/home_powered_by_code.png/></div></td>
          </table>
        </section>

        <section data-auto-animate>
          <h1>Auto-Animate</h1>
        </section>
        <section data-auto-animate>
          <h1 style="margin-top: 100px; color: red;">Auto-Animate</h1>
        </section>


        <section data-markdown="/get-my-adrian/presentation-1.md"
                data-separator="^---$"
                data-separator-vertical="^--$"
                data-separator-notes="^Note:"
                data-charset="utf-8">
        </section>
<!--
        <section>
          <video
            data-autoplay
            src="/adrian_promo.mp4"></video>
        </section>
-->
      </div>
    </div>
<!-- this should rebuild -->
    <script type="module" src="/main.js"></script>
  </body>
</html>
